<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mimic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="focus">
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9 2h6"/></svg>
      Mimic
    </div>
    <button class="ghost" id="openSettings" aria-haspopup="dialog">Settings</button>
  </header>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>

  <section class="timer" aria-label="Timer">
    <div class="modes" role="group" aria-label="Timer mode">
      <button class="mode" data-mode="focus" aria-pressed="true">Pomodoro</button>
      <button class="mode" data-mode="short" aria-pressed="false">Short break</button>
      <button class="mode" data-mode="long" aria-pressed="false">Long break</button>
    </div>
    <div class="clock" id="clock" role="timer" aria-live="off">25:00</div>
    <div class="controls">
      <span style="width:2.6rem" aria-hidden="true"></span>
      <button class="start" id="start">START</button>
      <button class="skip" id="skip" aria-label="Skip to next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.5v13l9.5-6.5zM16.5 5h2.5v14h-2.5z"/></svg>
      </button>
    </div>
  </section>

  <div class="status">
    <div class="count" id="count">#1</div>
    <div class="now" id="now">Time to focus!</div>
  </div>

  <section aria-label="Tasks">
    <div class="tasks-head">
      <h2>Tasks</h2>
      <button class="ghost" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Task options">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:block"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
      <div class="menu" id="menu" hidden>
        <button data-act="clear-done">Clear finished tasks</button>
        <button data-act="clear-act">Reset pomodoro counts</button>
        <button data-act="clear-all">Clear all tasks</button>
      </div>
    </div>
    <ul id="list"></ul>
    <div id="addSlot"></div>
    <div class="summary" id="summary" hidden></div>
  </section>
</div>

<dialog id="settings" aria-labelledby="settingsTitle">
  <div class="sheet-head">
    <h2 id="settingsTitle">Timer settings</h2>
    <button class="btn plain" id="closeSettings" aria-label="Close">✕</button>
  </div>
  <div class="sheet-body">
    <h3>Length in minutes</h3>
    <div class="durations">
      <label>Pomodoro<input class="num" type="number" min="1" max="180" id="setFocus"></label>
      <label>Short break<input class="num" type="number" min="1" max="60" id="setShort"></label>
      <label>Long break<input class="num" type="number" min="1" max="120" id="setLong"></label>
    </div>
    <div class="row"><span>Auto-start breaks</span><label class="switch"><input type="checkbox" id="setAutoBreak" aria-label="Auto-start breaks"><span></span></label></div>
    <div class="row"><span>Auto-start pomodoros</span><label class="switch"><input type="checkbox" id="setAutoFocus" aria-label="Auto-start pomodoros"><span></span></label></div>
    <div class="row"><span>Auto-check finished tasks</span><label class="switch"><input type="checkbox" id="setAutoCheck" aria-label="Auto-check finished tasks"><span></span></label></div>
    <div class="row"><span>Long break every</span><span><input class="num" type="number" min="1" max="12" id="setInterval" aria-label="Pomodoros before a long break"> pomos</span></div>
    <h3 class="gap">Alarm</h3>
    <div class="row"><label for="setSound">Sound</label><span class="pair">
      <select class="num select" id="setSound">
        <option value="chime">Chime</option>
        <option value="bell">Bell</option>
        <option value="digital">Digital</option>
        <option value="kitchen">Kitchen</option>
        <option value="none">None</option>
      </select>
      <button class="btn plain" id="testSound" type="button">Test</button>
    </span></div>
    <div class="row"><label for="setVolume">Volume</label><input class="range" type="range" min="0" max="100" step="5" id="setVolume"></div>
    <div class="row"><label for="setRepeat">Repeat</label><span><input class="num" type="number" min="1" max="10" id="setRepeat"> times</span></div>
  </div>
  <div class="sheet-foot"><button class="btn dark" id="saveSettings">Save</button></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
